<header class="masthead">
  <div class="wrap mast-grid">

    <div class="mast-brand">
      <a class="brand" href="{{ "" | absURL }}" aria-label="payloadcraft — home">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="17" class="mk-ring"/>
          <circle cx="20" cy="20" r="9.5" class="mk-ring"/>
          <line x1="20" y1="1"  x2="20" y2="10" class="mk-line"/>
          <line x1="20" y1="30" x2="20" y2="39" class="mk-line"/>
          <line x1="1"  y1="20" x2="10" y2="20" class="mk-line"/>
          <line x1="30" y1="20" x2="39" y2="20" class="mk-line"/>
          <circle cx="20" cy="20" r="2.4" class="mk-dot"/>
        </svg>
        <span class="brand-txt">
          <span class="wordmark">payloadcraft</span>
          <span class="brand-sub">offensive security · field notes</span>
        </span>
      </a>
    </div>

    <div class="mast-meta" aria-hidden="true">
      <span class="mm-row"><span class="mm-k">DOC</span><span class="mm-v">{{ site.Params.docNo | default "FM-PC-26" }}</span></span>
      <span class="mm-row"><span class="mm-k">REV</span><span class="mm-v">{{ now.Format "01·06" }}</span></span>
      <span class="mm-row"><span class="mm-k">CLASS</span><span class="mm-v">UNCLASS · EDU</span></span>
    </div>

    <div class="mast-tools">
      <button id="mode-btn" class="mode-btn" type="button" aria-label="toggle dark mode" title="toggle dark mode">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5" class="mb-disc"/>
          <path class="mb-half" d="M8 3 A5 5 0 0 1 8 13 Z"/>
        </svg>
        <span class="lbl"></span>
      </button>
      <a class="tool-rss" href="{{ "blog/index.xml" | absURL }}" title="RSS full-text feed">RSS<span class="rss-dot" aria-hidden="true">●</span></a>
    </div>
  </div>

  <nav class="mast-nav" aria-label="primary">
    <div class="wrap nav-row">
      {{ $n := 1 }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>
          <span class="no">{{ printf "%02d" $n }}</span>{{ .Name }}
        </a>
        {{ $n = add $n 1 }}
      {{ end }}
      <span class="nav-fill" aria-hidden="true"></span>
      <span class="nav-arrow" aria-hidden="true">▸▸</span>
    </div>
  </nav>
</header>
