{{/* faultline sandbox topology. inline svg so it picks up the theme tokens; wide + tall variants, swapped at 640px */}}
<figure class="fl-fig" role="img" aria-label="The target agent and Postgres run inside a default-deny namespace. The agent can reach only the MITM proxy and its database. The proxy alone reaches the LLM provider and writes every call to a tape that the scorer reads. The internet, cloud metadata and the LLM are blocked for the agent directly.">
<svg class="fl-wide" viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><marker id="fl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fl-ahp" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="fl-k" x="20" y="28">NAMESPACE faultline-&lt;run-id&gt; · DEFAULT-DENY NETWORKPOLICY · FRESH CA</text>
  <rect class="fl-ns" x="20" y="40" width="600" height="290"/>

  <rect class="fl-b" x="50" y="78" width="200" height="74"/>
  <text class="fl-t" x="66" y="106">TARGET AGENT</text>
  <text class="fl-s" x="66" y="128">LangGraph · run_sql tool</text>

  <rect class="fl-b fl-bp" x="340" y="78" width="260" height="122"/>
  <text class="fl-t fl-ta" x="356" y="106">MITM PROXY</text>
  <text class="fl-s" x="356" y="128">mitmproxy + faultline addon</text>
  <text class="fl-s" x="356" y="150">record · replay · break · poison</text>
  <text class="fl-s fl-sa" x="356" y="180">429 · latency · bad JSON · inject</text>

  <rect class="fl-b" x="50" y="232" width="200" height="74"/>
  <text class="fl-t" x="66" y="260">POSTGRES</text>
  <text class="fl-s" x="66" y="282">seeded per run · column grants</text>

  <rect class="fl-bx" x="340" y="232" width="260" height="74"/>
  <text class="fl-t fl-ta" x="356" y="256">AGENT EGRESS</text>
  <text class="fl-s fl-sa" x="356" y="276">✕ internet   ✕ cloud metadata</text>
  <text class="fl-s fl-sa" x="356" y="294">✕ LLM direct</text>

  <rect class="fl-b" x="690" y="78" width="250" height="74"/>
  <text class="fl-t" x="706" y="106">LLM PROVIDER</text>
  <text class="fl-s" x="706" y="128">Nemotron via LiteLLM · or mock</text>

  <rect class="fl-b" x="690" y="182" width="250" height="64"/>
  <text class="fl-t" x="706" y="208">TAPE.JSONL</text>
  <text class="fl-s" x="706" y="229">every request, response, fault</text>

  <rect class="fl-b" x="690" y="274" width="250" height="64"/>
  <text class="fl-t" x="706" y="300">SCORER</text>
  <text class="fl-s" x="706" y="321">+ promptfoo · LangSmith</text>

  <line class="fl-ax" x1="250" y1="115" x2="336" y2="115" marker-end="url(#fl-ah)"/>
  <text class="fl-l" x="262" y="106">:8080 only</text>
  <line class="fl-ax" x1="150" y1="152" x2="150" y2="228" marker-end="url(#fl-ah)"/>
  <text class="fl-l" x="160" y="195">:5432</text>
  <line class="fl-ax" x1="600" y1="115" x2="686" y2="115" marker-end="url(#fl-ah)"/>
  <text class="fl-l" x="606" y="106">allow-listed</text>
  <line class="fl-ax" x1="600" y1="180" x2="686" y2="210" marker-end="url(#fl-ah)"/>
  <line class="fl-ax" x1="815" y1="246" x2="815" y2="270" marker-end="url(#fl-ah)"/>
  <text class="fl-c" x="20" y="372">The agent's only way out is the proxy. The proxy's only way out is the model API.</text>
</svg>
<svg class="fl-tall" viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><marker id="fl-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fl-ahp" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="fl-k" x="10" y="20">NAMESPACE PER RUN · DEFAULT-DENY</text>
  <rect class="fl-ns" x="10" y="30" width="340" height="300"/>

  <rect class="fl-bx" x="25" y="45" width="310" height="50"/>
  <text class="fl-t fl-ta" x="37" y="66">AGENT EGRESS BLOCKED</text>
  <text class="fl-s fl-sa" x="37" y="84">✕ internet ✕ metadata ✕ LLM direct</text>

  <rect class="fl-b" x="25" y="110" width="310" height="50"/>
  <text class="fl-t" x="37" y="131">TARGET AGENT</text>
  <text class="fl-s" x="37" y="149">LangGraph · run_sql tool</text>

  <rect class="fl-b fl-bp" x="25" y="200" width="200" height="110"/>
  <text class="fl-t fl-ta" x="37" y="222">MITM PROXY</text>

  <text class="fl-s" x="37" y="262">record · break · poison</text>
  <text class="fl-s fl-sa" x="37" y="290">429 · lag · bad JSON</text>

  <rect class="fl-b" x="240" y="200" width="95" height="110"/>
  <text class="fl-t" x="250" y="222">POSTGRES</text>
  <text class="fl-s" x="250" y="242">per run</text>
  <text class="fl-s" x="250" y="262">column</text>
  <text class="fl-s" x="250" y="280">grants</text>

  <line class="fl-ax" x1="125" y1="160" x2="125" y2="196" marker-end="url(#fl-ah2)"/>
  <text class="fl-l" x="133" y="183">:8080</text>
  <line class="fl-ax" x1="287" y1="160" x2="287" y2="196" marker-end="url(#fl-ah2)"/>
  <text class="fl-l" x="295" y="183">:5432</text>

  <line class="fl-ax" x1="125" y1="310" x2="125" y2="376" marker-end="url(#fl-ah2)"/>
  <text class="fl-l" x="133" y="352">allow-listed</text>
  <rect class="fl-b" x="25" y="380" width="200" height="56"/>
  <text class="fl-t" x="37" y="403">LLM PROVIDER</text>
  <text class="fl-s" x="37" y="423">Nemotron · or mock</text>

  <line class="fl-ax" x1="215" y1="310" x2="270" y2="376" marker-end="url(#fl-ah2)"/>
  <rect class="fl-b" x="240" y="380" width="95" height="56"/>
  <text class="fl-t" x="250" y="403">TAPE</text>
  <text class="fl-s" x="250" y="423">every call</text>

  <line class="fl-ax" x1="287" y1="436" x2="287" y2="466" marker-end="url(#fl-ah2)"/>
  <rect class="fl-b" x="25" y="470" width="310" height="56"/>
  <text class="fl-t" x="37" y="493">SCORER</text>
  <text class="fl-s" x="37" y="513">+ promptfoo · LangSmith</text>
</svg>
</figure>
